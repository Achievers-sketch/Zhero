# Local PostgreSQL with pgvector (vector search arrives with the RAG milestone).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zhero
      POSTGRES_PASSWORD: zhero_local_password
      POSTGRES_DB: zhero
    ports:
      - "5432:5432"
    volumes:
      - zhero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhero"]
      interval: 5s
      retries: 10

volumes:
  zhero_pgdata:
