[project]
name = "zhero-backend"
version = "0.1.0"
description = "Zhero API: digital twin and evidence-verified AI for medical equipment maintenance"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated files keep the tool's own typing style.
"migrations/versions/*" = ["UP006", "UP007", "UP035", "UP045"]
